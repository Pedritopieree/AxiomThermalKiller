name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Force Clean Android SDK
        run: |
          # Completely clear conflicting variables
          unset ANDROID_HOME
          unset ANDROID_SDK_ROOT
          unset ANDROID_SDK_HOME
          
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> $GITHUB_ENV
          
          # Make sure only one path exists
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export ANDROID_SDK_ROOT=/usr/local/lib/android/sdk
          
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-34" "build-tools;34.0.0" || true

      - name: Create Gradle Wrapper + Build
        run: |
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export ANDROID_SDK_ROOT=/usr/local/lib/android/sdk
          
          gradle wrapper --gradle-version 8.2.1 || (
            curl -fsSL https://services.gradle.org/distributions/gradle-8.2.1-bin.zip -o g.zip
            unzip -q g.zip
            ./gradle-8.2.1/bin/gradle wrapper --gradle-version 8.2.1
          )
          chmod +x gradlew
          
          ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AxiomThermalKiller
          path: app/build/outputs/apk/debug/*.apk
