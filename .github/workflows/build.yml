name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'tools platform-tools build-tools;34.0.0 platforms;android-34'

      - name: Accept Android licenses
        run: |
          yes | sdkmanager --licenses || true
          mkdir -p $ANDROID_HOME/licenses
          echo -e "24333f8a63b6825ea9c5514f83c2829b004d1fee\n" > $ANDROID_HOME/licenses/android-sdk-license
          echo -e "84831b94096449ac528f7852a3aad4bdd3b15f79\n" > $ANDROID_HOME/licenses/android-sdk-preview-license

      - name: Create Gradle Wrapper
        run: |
          gradle wrapper --gradle-version 8.2.1 || true
          # fallback if gradle is not installed
          if [ ! -f gradlew ]; then
            curl -sL https://services.gradle.org/distributions/gradle-8.2.1-bin.zip -o gradle.zip
            unzip -q gradle.zip
            ./gradle-8.2.1/bin/gradle wrapper --gradle-version 8.2.1
          fi
          chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AxiomThermalKiller
          path: app/build/outputs/apk/debug/*.apk
